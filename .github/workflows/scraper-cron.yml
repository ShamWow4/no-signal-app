name: Daily AV Data Scraper

on:
  schedule:
    # Runs at 08:00 UTC (3:00 AM Central Time) every day
    - cron: '0 8 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scraper
        run: npm install

      - name: Create serviceAccountKey.json
        working-directory: ./scraper
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Create .env
        working-directory: ./scraper
        run: |
          echo "FIRECRAWL_API_KEY=${{ secrets.FIRECRAWL_KEY }}" > .env

      - name: Run Scraper Pipeline
        working-directory: ./scraper
        run: npm start
